name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature: [default, ffi_safety]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen --force

      - name: Build cdylib
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.feature }}" == "ffi_safety" ]]; then
            cargo build --release --features ffi_safety --verbose
          else
            cargo build --release --verbose
          fi

      - name: Generate C header
        shell: bash
        run: |
          set -euo pipefail
          bash tools/gen_header.sh

        # Collect built library into artifacts/
      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp target/release/libratatui_ffi.so artifacts/libratatui_ffi-${{ matrix.feature }}-linux.so
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp target/release/libratatui_ffi.dylib artifacts/libratatui_ffi-${{ matrix.feature }}-macos.dylib
          else
            cp target/release/ratatui_ffi.dll artifacts/ratatui_ffi-${{ matrix.feature }}-windows.dll
          fi
          cp include/ratatui_ffi.h artifacts/ratatui_ffi-${{ matrix.feature }}.h
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratatui-ffi-${{ runner.os }}-${{ matrix.feature }}
          path: artifacts/*

  release:
    name: Attach to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ratatui-ffi-*
          merge-multiple: true

      - name: Show downloaded files
        run: ls -la

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.so
            *.dylib
            *.dll
            ratatui_ffi.h
